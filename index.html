<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="James Baskin">
  <title>James Baskin</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1><span>WEBSITE</span> <span>IN PROGRESS</span></h1>
  </main>
  <footer class="player" aria-label="Music player">
    <div id="custom-controls" hidden>
      <div class="controls">
        <button id="play" type="button" aria-label="Play music">PLAY</button>
        <div class="track">
          <label for="track">TRACK</label>
          <select id="track"></select>
        </div>
      </div>
      <div class="timeline">
        <label for="seek" class="sr-only">Track position</label>
        <input id="seek" type="range" min="0" max="100" value="0" step="0.1" disabled>
        <span id="time" class="time">0:00 / -:--</span>
        <button id="mute" type="button" aria-label="Mute music" aria-pressed="false">MUTE</button>
        <label for="volume" class="sr-only">Volume</label>
        <input id="volume" type="range" min="0" max="1" value="0.5" step="0.05">
      </div>
      <p id="error" class="error" role="alert" hidden></p>
    </div>
    <audio id="audio" controls loop preload="metadata" src="audio/thuleulykken-mix-1.mp3">
      Your browser does not support audio playback.
    </audio>
    <noscript>Thuleulykken mix 1</noscript>
  </footer>
  <script src="tracks.js"></script>
  <script src="player.js"></script>
</body>
</html>
