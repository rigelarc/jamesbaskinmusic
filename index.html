    * { box-sizing: border-box; }

    html {
      background: #000;
      color: #fff;
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-width: 240px;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-rows: 1fr auto;
      font-family: "OCR-A", "Courier New", monospace;
    }

    main {
      display: grid;
      place-items: center;
      padding: 3rem 5vw;
    }

    h1 {
      margin: 0;
      font-family: "OCR-A", "Courier New", monospace;
      font-size: clamp(1.5rem, 10.4vw, 11rem);
      font-weight: 400;
      line-height: 1.28;
      letter-spacing: -0.025em;
      text-align: center;
    }

    h1 span {
      display: block;
      white-space: nowrap;
    }

    .player {
      width: min(46rem, 90%);
      margin: 0 auto;
      padding: 1.25rem 0 max(1.5rem, env(safe-area-inset-bottom));
      border-top: 1px solid #353535;
    }

    .controls { display: flex; align-items: center; gap: 1rem; }
    .track { flex: 1; min-width: 0; }
    label { display: block; font-size: .7rem; color: #aaa; margin-bottom: .4rem; }
    button, select, input { font: inherit; }
    button, select {
      min-height: 44px;
      color: #fff;
      background: #000;
      border: 1px solid #666;
      border-radius: 0;
    }
    button { padding: .7rem 1rem; cursor: pointer; }
    button:hover { background: #fff; color: #000; }
    button:disabled { cursor: wait; color: #aaa; }
    #play { align-self: flex-end; min-width: 7rem; }
    select { width: 100%; padding: .6rem .5rem; text-overflow: ellipsis; }
    :focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
    .timeline { display: flex; align-items: center; gap: .75rem; margin-top: .6rem; }
    input[type="range"] { height: 26px; margin: 0; min-width: 0; accent-color: #fff; cursor: pointer; }
    #seek { flex: 1; }
    #volume { width: 5rem; }
    .time { color: #aaa; font-size: .7rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
    #mute { border: 0; padding: .5rem; font-size: .7rem; min-width: 4rem; }
    .error { color: #aaa; font-size: .7rem; margin: .3rem 0 0; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    audio { width: 100%; margin-top: .7rem; }
    [hidden] { display: none !important; }

    @media (max-width: 480px) {
      .controls { gap: .6rem; }
      select { font-size: .8rem; }
      #play { min-width: 5.5rem; padding-inline: .6rem; }
      .timeline { flex-wrap: wrap; gap: .4rem; }
      #seek { flex-basis: calc(100% - 7rem); }
    }

    ::selection { color: #000; background: #fff; }
  </style>
</head>

  <main>
    <h1><span>WEBSITE</span> <span>IN PROGRESS</span></h1>
  </main>
  <footer class="player" aria-label="Music player">
    <div id="custom-controls" hidden>
      <div class="controls">
        <button id="play" type="button" aria-label="Play music">PLAY</button>
        <div class="track">
          <label for="track">TRACK</label>
          <select id="track"></select>
        </div>
      </div>
      <div class="timeline">
        <label for="seek" class="sr-only">Track position</label>
        <input id="seek" type="range" min="0" max="100" value="0" step="0.1" disabled>
        <span id="time" class="time">0:00 / —:——</span>
        <button id="mute" type="button" aria-label="Mute music" aria-pressed="false">MUTE</button>
        <label for="volume" class="sr-only">Volume</label>
        <input id="volume" type="range" min="0" max="1" value="0.5" step="0.05">
      </div>
      <p id="error" class="error" role="alert" hidden></p>
    </div>

  <script src="tracks.js"></script>
  <script>
    (() => {
      const audio = document.getElementById('audio');
      const play = document.getElementById('play');
      const select = document.getElementById('track');
      const seek = document.getElementById('seek');
      const volume = document.getElementById('volume');
      const mute = document.getElementById('mute');
      const time = document.getElementById('time');
      const errorMessage = document.getElementById('error');
      const tracks = window.SITE_TRACKS;
      if (!Array.isArray(tracks) || !tracks.length) return;

      tracks.forEach((track, index) => {
        const option = document.createElement('option');
        option.value = String(index);
        option.textContent = track.title;
        select.appendChild(option);
      });

      audio.src = tracks[0].src;
      audio.volume = Number(volume.value);
      audio.controls = false;
      audio.hidden = true;
      document.getElementById('custom-controls').hidden = false;
      let request = 0;

      function format(seconds) {
        if (!Number.isFinite(seconds)) return '—:——';
        return Math.floor(seconds / 60) + ':' + String(Math.floor(seconds % 60)).padStart(2, '0');
      }

      function updateTime() {
        const duration = audio.duration;
        seek.disabled = !Number.isFinite(duration) || duration <= 0;
        seek.max = Number.isFinite(duration) && duration > 0 ? String(duration) : '100';
        seek.value = String(audio.currentTime || 0);
        seek.setAttribute('aria-valuetext', format(audio.currentTime) + ' of ' + format(duration));
        time.textContent = format(audio.currentTime) + ' / ' + format(duration);
      }

      function updatePlay() {
        play.textContent = audio.paused ? 'PLAY' : 'PAUSE';
        play.setAttribute('aria-label', audio.paused ? 'Play music' : 'Pause music');
      }

      function updateVolume() {
        const silent = audio.muted || audio.volume === 0;
        mute.textContent = silent ? 'UNMUTE' : 'MUTE';
        mute.setAttribute('aria-pressed', String(silent));
        mute.setAttribute('aria-label', silent ? 'Unmute music' : 'Mute music');
      }

      async function start() {
        const currentRequest = ++request;
        errorMessage.hidden = true;
        try {
          await audio.play();
        } catch (error) {
          if (currentRequest !== request || error.name === 'AbortError') return;
          errorMessage.textContent = 'AUDIO UNAVAILABLE — PLEASE TRY AGAIN';
          errorMessage.hidden = false;
          updatePlay();
        }
      }

      play.addEventListener('click', () => {
        if (audio.paused) start();
        else { ++request; audio.pause(); }
      });

      select.addEventListener('change', () => {
        const resume = !audio.paused;
        ++request;
        audio.pause();
        audio.src = tracks[Number(select.value)].src;
        audio.load();
        updateTime();
        errorMessage.hidden = true;
        if (resume) start();
      });

      seek.addEventListener('input', () => {
        if (Number.isFinite(audio.duration)) audio.currentTime = Number(seek.value);
        updateTime();
      });
      volume.addEventListener('input', () => {
        audio.volume = Number(volume.value);
        audio.muted = false;
        updateVolume();
      });
      mute.addEventListener('click', () => {
        if (audio.muted || audio.volume === 0) {
          if (audio.volume === 0) { audio.volume = 0.5; volume.value = '0.5'; }
          audio.muted = false;
        } else audio.muted = true;
        updateVolume();
      });
      audio.addEventListener('play', updatePlay);
      audio.addEventListener('playing', updatePlay);
      audio.addEventListener('pause', updatePlay);
      audio.addEventListener('error', () => {
        errorMessage.textContent = 'AUDIO UNAVAILABLE — PLEASE TRY AGAIN';
        errorMessage.hidden = false;
        updatePlay();
      });
      audio.addEventListener('loadedmetadata', updateTime);
      audio.addEventListener('durationchange', updateTime);
      audio.addEventListener('timeupdate', updateTime);
      audio.addEventListener('volumechange', updateVolume);
      updateTime();
    })();
  </script>
</body>
</html>
